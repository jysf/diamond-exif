  - id: audit-table-exif3-tag-ids
    question: "DEC-008 gives 0xA437, 0xA438 and 0xA439 the names ImageEditor, ImageEditingSoftware and MetadataEditingSoftware; ExifTool 13.55 names those ids Photographer, ImageEditor and CameraFirmware. Which ids are right, and which categories do the real tags get?"
    priority: high
    status: answered
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-05
    assigned_to: null
    notes: |
      ANSWERED 2026-11-05 by the DEC-008 amendment (commit ad9e3a8, "correct the Exif 3.0
      ids after the SPEC-012 live check"): 0xA437 Photographer (Authorship), 0xA438
      ImageEditor (Authorship), 0xA439 CameraFirmware, 0xA43A RAWDevelopingSoftware,
      0xA43B ImageEditingSoftware, 0xA43C MetadataEditingSoftware (all Software). The
      SPEC-012 fix round applied it to src/audit/category.rs, the test table, the harness
      table and the name check; the record now has 41 ids and those six rows match
      ExifTool name for name. Original finding follows.

      Measured in SPEC-012 (ExifTool 13.55, `exiftool -v3 -G1 -a -s -u <one-entry TIFF>`,
      record tests/oracle-fixtures/exiftool/audit-tag-names.txt). The three ids are in the
      DEC-008 table, so the audit currently classifies them by the DEC's names:
        0xA437  DEC ImageEditor (Authorship)              ExifTool Photographer
        0xA438  DEC ImageEditingSoftware (Software)       ExifTool ImageEditor
        0xA439  DEC MetadataEditingSoftware (Software)    ExifTool CameraFirmware
      Also measured (one-off probe, not in the record): ExifTool names 0xA43A
      RAWDevelopingSoftware, 0xA43B ImageEditingSoftware, 0xA43C MetadataEditingSoftware.
      So the DEC's two software names look like they belong at 0xA43B and 0xA43C, and the
      person-ish names at 0xA437 and 0xA438. The DEC and the table were NOT edited. If the
      ids move: one DEC amendment, `by_id` in src/audit/category.rs, the three rows in the
      tests (category.rs table and fuzz/shared/audit_invariants.rs) and the name table in
      tests/support/audit_tags.rs (DIFFERING in tests/audit_oracle.rs shrinks).

  - id: audit-table-exiftool-names
    question: "Nine DEC-008 rows name the right tag id but use a different name from ExifTool's. Keep DEC-008's names, or adopt ExifTool's?"
    priority: low
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-05
    assigned_to: null
    notes: |
      Naming only; the id is the same tag in both. Measured in SPEC-012 (ExifTool 13.55):
        0x0132  DEC DateTime               ExifTool ModifyDate
        0x9004  DEC DateTimeDigitized      ExifTool CreateDate
        0x927C  DEC MakerNote              ExifTool MakerNoteUnknownText (the name depends on
                                           the content ExifTool recognises; measured with a
                                           text-like payload)
        0xA430  DEC CameraOwnerName        ExifTool OwnerName
        0xA431  DEC BodySerialNumber       ExifTool SerialNumber
        0x02BC  DEC XMP                    ExifTool ApplicationNotes (the TIFF tag; ExifTool
                                           prints the packet's own tags, not this name, in a
                                           normal listing: the name shows in `-v3`)
        0x8649  DEC Photoshop              ExifTool PhotoshopSettings
        0x8773  DEC InterColorProfile      ExifTool ICC_Profile
        0x0201  DEC JPEGInterchangeFormat  ExifTool ThumbnailOffset (in an IFD1)
      Of the 41 measured ids, 32 match name for name; these 9 are the only differences
      (after the audit-table-exif3-tag-ids amendment). tests/audit_oracle.rs pins this
      list (DIFFERING), so adopting either set of names is a visible change.

  - id: audit-category-region-vs-tag-shape
    question: "SPEC-012's fuzz invariant says region categories appear only on Region items, but DEC-008 also puts TIFF tags 0x02BC, 0x83BB, 0x8649 and 0x8773 in Xmp, Iptc and Icc. Which wins?"
    priority: low
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-05
    assigned_to: null
    notes: |
      The two statements cannot both hold. SPEC-012 built the DEC-008 table as written (a
      tag item can be Xmp, Iptc or Icc) and weakened the invariant to what is true: a
      Region item has exactly its DEC-008 region category, and Jumbf (the only category
      with no tag row) appears on Region items only. The converse is asserted by the
      `category_shape` guard of fuzz/shared/audit_invariants.rs, with a plant for each
      direction. Nothing to decide unless the intent was that tags 700 / 33723 / 34377 /
      34675 should not be findings.

  - id: tiff-container-memory-amplification
    question: "Container::parse keeps every entry of every IFD, so a ~790 KB TIFF of 511 overlapping SubIFDs makes 33.5 million entries (about 800 MB). Bound it in a TIFF spec?"
    priority: medium
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-05
    assigned_to: null
    notes: |
      Measured in SPEC-012 (release build, Apple silicon, `/usr/bin/time -l`; the test is
      `container_amplification_is_measured_and_reported` in tests/audit_oracle.rs, built by
      `tests/audit_oracle.rs::hostile`). Input 789,516 bytes -> Container::parse reports
      512 IFDs, 33,488,386 entries, 0 issues (a CLEAN parse), 803,721,264 bytes of Entry
      data (24 bytes each), about 1,018x the input, 103 ms. Peak resident set size 950 MB
      (`maximum resident set size` 949,796,864; `peak memory footprint` 949,404,920) over
      a parse and a second parse inside `audit`. The audit adds at most MAX_INVENTORY_ITEMS
      items and as many findings on top (their size was not measured separately), and
      takes 174 ms including its own parse. This exists in Container today, independent of the audit; the audit does
      not copy the entries. exif-audit will parse untrusted files in bulk (STAGE-003), so
      a per-file memory bound (entries per container, or lazily read IFDs) wants a TIFF
      spec before SPEC-016.

  # ── SPEC-013: inventory parity against ExifTool 13.55 ──────────────────────
  # Command for every entry below: `exiftool -a -u -G1 -H -s <file>`; the listings
  # are committed in tests/oracle-fixtures/exiftool-inventory/ and the pinned
  # differences are the KNOWN_DIVERGENCES table in tests/support/inventory.rs.
  - id: exiftool-omits-entries-with-unreadable-values
    question: "ExifTool 13.55 lists no tag for an IFD entry whose value it cannot read (payload or count runs past the end) while the audit lists the entry. Is listing it the right behaviour for an audit?"
    priority: low
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-06
    assigned_to: null
    notes: |
      DIVERGENCE (SPEC-013, Class A), five seeds: tiff_ifd/ascii-count-past-eof
      (ours IFD0 0x010f, 0x0110, 0x0131, 0x0132, 0x013b; ExifTool lists no tag at
      all), count-overflow and count-overflow-be (ours IFD0 0x02bd, 0x02be, 0x02bf,
      0x02c1; ExifTool lists only 0x02c0 `Exif_0x02c0`, which we list too),
      payload-past-eof and -be (ours IFD0 0x02bd; ExifTool lists ImageWidth only).
      Right side: ours. An entry in the file is evidence even when its value
      cannot be read, and an audit that dropped it would hide it. Every entry is a
      pinned KNOWN_DIVERGENCES row (`ours_only`, `ours_hides: false`); the tests
      `class_a_unreadable_values_are_ours_only_and_still_present` assert the entry
      is in our listing and not in ExifTool's.

  - id: exiftool-rereads-a-revisited-ifd
    question: "When an IFD pointer names an offset already read, ExifTool 13.55 lists that IFD's entries again under the new group while the audit visits each offset once (DEC-005). Keep one visit?"
    priority: low
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-06
    assigned_to: null
    notes: |
      DIVERGENCE (SPEC-013, Class B), two seeds. tiff_ifd/exif-points-at-ifd0:
      ExifTool lists `[IFD0] 0x0100 ImageWidth` and `[ExifIFD] 0x0100 ImageWidth`
      (the Exif pointer names IFD0); we list IFD0 0x0100 once and record
      CyclicIfd. tiff_ifd/self-cycle: `[IFD0] 0x0100` and `[IFD1] 0x0100` (IFD0's
      next-IFD word names IFD0); same on our side. Right side: ours (the same
      bytes, nothing new to strip). `ours_hides` is true, so the invariant
      "ExifTool lists something we do not => the audit is not clean" applies and
      holds: `Health::exif_issues > 0` on both.

  - id: audit-depth-limit-and-ifd-caps-differ-from-exiftool
    question: "The audit's IFD depth limit (8), SubIFD handling and entry budget (len / 12) differ from ExifTool 13.55's limits. Which differences matter to an audit, and does the not-clean signal suffice?"
    priority: medium
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-06
    assigned_to: null
    notes: |
      DIVERGENCES (SPEC-013, Classes C and D). C: tiff_ifd/deep-nesting: ExifTool
      lists 12 `ImageWidth` lines (IFD0 and eleven `[SubIFD] 0x0100`); we list IFD0
      and eight SubIFD entries and record IfdDepthExceeded, so `Health::exif_issues
      > 0` and `clean == false` (asserted; `ours_hides` is true). D: ExifTool keeps
      the first 10 SubIFDs of an array (`Warning: Ignoring N SubIFD directories`,
      SPEC-017) and lists no entry of the overlapping ones; we list the entries
      within the `len / 12` entry budget: tiff_ifd/overlapping-subifds (ours 255
      `SubIFD 0x00ff`), audit/audit-many-overlapping-ifds (ours 767 `0x02ff`),
      entry-budget-exact (ours `0x0002` x1, `0xffff` x3) and entry-budget-over
      (ours `0x0003` x1, `0xffff` x2). Neither side is "the" answer: two documented
      limits. The invariant that matters is the one asserted for every pinned
      divergence: where ExifTool lists more than we do, the audit is not clean
      (`ours_hides_implies_not_clean_for_every_divergence`, live and replay). The
      Class D rows list MORE than ExifTool, so they hide nothing. Resolving the
      limits is out of scope for SPEC-013.

  - id: audit-directory-valued-tiff-tags
    question: "The audit lists the TIFF tags 0x02BC, 0x83BB, 0x8649 and 0x8773 (XMP, IPTC, Photoshop, ICC) as plain tag items; ExifTool decodes their content into other groups and never lists the tag itself. Compare them differently?"
    priority: low
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-06
    assigned_to: null
    notes: |
      NOT A DIVERGENCE (SPEC-013, Class H), a recorded exclusion. The inventory
      model leaves the eight ids in `inventory::DIRECTORY_VALUED` out of the tag
      multiset: the four pointer tags (0x8769, 0x8825, 0xA005, 0x014A: their child
      IFDs' entries are compared in their own groups) and these four. Measured:
      the one-entry TIFFs audit-tags/tag-02bc, -83bb, -8649, -8773 give no tag line
      for the id (ExifTool lists the decoded contents, or nothing when the payload
