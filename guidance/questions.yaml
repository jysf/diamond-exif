  - id: preview-unclassified-entries
    question: "Should the policy preview say what `All` and `Everything` do to inventory-only entries (tags with no DEC-008 category)?"
    priority: low
    status: open
    raised_by: claude-opus-5-5
    raised_at: 2026-11-06
    assigned_to: null
    notes: |
      DEC-009 and SPEC-014 keep the preview to findings. An unclassified tag has no
      category, so a category-set policy cannot speak about it. Whether `All` removes it
      depends on the container (a JPEG's Exif segment goes whole; structural tags of a bare
      TIFF must stay) and on the writer. Decide in the first writer spec; the preview then
      gains a count or a disposition for them.

