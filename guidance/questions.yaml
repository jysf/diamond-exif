      DIVERGENCE (SPEC-013, Class R; not in the design's table, found by the sweep):
      13 inputs, all `regions_ours_only`, `ours_hides: false`. Hand-built stubs:
      jpeg-icc-stub (a 128-byte header, zero tags: ExifTool lists nothing) and
      jpeg-jumbf-stub (a bare `jumb` box: nothing); their well-formed twins
      jpeg-icc-valid (16 `[ICC-header]` lines and `[ICC_Profile] ProfileDescription`)
