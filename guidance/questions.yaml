  - id: report-dec-010-build-doubts
    question: "Four DEC-010 / SPEC-015 rules the SPEC-015 build found underspecified or awkward: which wording should SPEC-016 and a later DEC-010 amendment take?"
    priority: medium
    status: open
    raised_by: claude-sonnet-5-5
    raised_at: 2026-11-06
    assigned_to: null
    notes: |
      Raised by the SPEC-015 build (HANDOFF-031). decisions/ was not touched.
      (1) The summary's `residual_findings` is `Some(0)` when a policy is set and no file is
      reliable (reliable_files = 0), and the text summary prints "residual findings 0 (reliable
      files only)". A reader can take 0 for "nothing would remain", which is the claim DEC-009's
      amendment forbids for an unreliable file. SPEC-015 rule 5 fixed "sums reliable files only",
      so it was built that way; consider `null` when unreliable_files > 0 or reliable_files = 0.
      (2) A `Custom` policy is named "custom" in JSON/text/CSV with no way to see which categories
      it removes. A CI consumer comparing runs cannot tell two custom policies apart.
      (3) Label and failure-detail length: rule 8 calls the label "bounded", but the renderers do
      not truncate it (a cut would break the "label text equals safe_text" facts guard and hide
      which file). Output is linear in the caller's label, at most 4x its bytes escaped (and a
      CSV repeats the label on every row of the file). SPEC-016 should bound a path (PATH_MAX).
      The failure `detail` is printed even with `values` off: it is caller text, not a payload,
      but the fuzz target feeds it file bytes, so SPEC-016 must pass only OS error messages.
      (4) DEC-010 part 4 lists TAB and CR as formula-guard triggers, but part 2 escapes TAB and CR
      first (`\t`, `\r`), so through `render_csv` those two triggers never fire; the guard on them
      is defence in depth, exercised only by the row-level unit test. Also part 2 names no
      form for DEL (built: `\x7f`, lowercase hex everywhere) and the JSON IFD name `other` is
      unreachable (IfdKind is non_exhaustive but exhaustive inside the crate).
