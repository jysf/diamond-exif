      for a bare TIFF (`tiff_region_lines_come_only_from_directory_valued_ids`).
      Open: whether the audit CLI should compare the decoded contents too.

  - id: exiftool-lists-no-group-for-undecodable-regions
    question: "For a located JPEG region whose payload ExifTool 13.55 cannot decode (a header-only ICC profile, a bare jumb box, the minimal XMP, IPTC, ICC and JUMBF payloads of the seeds) ExifTool lists no group at all while the audit lists the region. Keep reporting the region?"
    priority: low
