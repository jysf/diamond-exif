# guidance/signals.yaml
# The Signals registry — ONE typed ledger for EVERY kind of feedback, so
# nothing rots un-decided. Coding lessons already had a forcing function
# (reflect at ship → codify into AGENTS.md). This gives the SAME teeth to
# process/tooling feedback, product/usage signals, and risks. See docs/signals.md.
#
# Every signal MUST have:
#   - id:             stable kebab-case identifier
#   - type:           lesson | process-debt | product | risk | golden-path
#   - summary:        one sentence
#   - evidence:       the specs/usage that raised it; for lessons, the N-count
#   - bar:            lessons only — 'N=3 same-outcome' | 'N=2 paired-opposing'
#                     (the codification bar); null for non-lessons
#   - status:         open | watch | accepted | rejected | codified | done | dropped
#   - disposition_at: stage-close | project-close   (which close owns the decision)
#   - first_flagged:  YYYY-MM-DD
#   - last_touched:   YYYY-MM-DD   (bump every time a close walks it — no silent carry)
#   - raised_by:      human | claude | <agent-id>
#   - notes:          optional — where it landed / defer-trigger / reject-reason
#
# Type → who dispositions it, and the terminal states it can reach:
#   lesson       → STAGE close.   open → watch (accumulating N) → codified | dropped.
#                  Graduates to `codified` ONLY once evidence meets the `bar`
#                  (N=3 same-outcome, or N=2 paired-opposing). This IS the WATCH
#                  ledger — promoted from prose-scattered-in-stage-files to one
#                  visible file, which is the cross-stage-visibility fix.
#   process-debt → PROJECT close. open → accepted (scheduled) | rejected | done | dropped.
#   product      → PROJECT close. a usage/dogfooding signal; feeds the NEXT project's framing.
#   risk         → revisited at each close; no auto-action (watch indefinitely).
#   golden-path  → PROJECT close. open → watch → codified | dropped, same as a lesson.
#                  The ONLY type that records something that WORKED. Every other
#                  type here is a problem, which meant "this approach worked so
#                  well another project should copy it wholesale" had nowhere to
#                  live and was lost at every close.
#                  THE BAR IS HARDER HERE, NOT SOFTER: a wrong paved road is worse
#                  than no road, because people follow it. Capture candidates
#                  freely; promote almost none. N=3 or it stays a preference.
#
# The ritual (FIRST_SESSION_PROMPTS.md Prompt 1d / 1e): at each close, walk every
# open/watch signal that close owns; each gets accept-and-schedule /
# reject-with-reason / defer-with-trigger, and `last_touched` bumped. NO silent carry.
#
# Browse with `just dash signals` (open count surfaces in `just dash`'s flags).
#
# The entries below are illustrative seeds (drawn from real dogfooding). Replace
# them with your own, or delete them and start empty.

signals:
  # --- lesson: at its bar, queued to codify at the owning stage's close -------
  - id: flag-default-explicitness
    type: lesson
    summary: "Specs name a flag's accepted values but not its default, so build guesses."
    evidence: "SPEC-026/028/029 (--format default left unstated) — N=3 same-outcome"
    bar: "N=3 same-outcome"
    status: codified
    disposition_at: stage-close
    first_flagged: 2026-05-20
    last_touched: 2026-11-06
    raised_by: claude
    notes: "Codified at STAGE-003 close (2026-11-06): the spec template Outputs section already requires each flag's accepted values and its default; SPEC-016 and DEC-011 applied it (every default stated, pinned by usage_text_names_every_default). No further template change needed."

  # --- process-debt: THE lever — re-flagged twice, still un-adopted -----------
  - id: lightweight-verify-lane
    type: process-debt
    summary: "A bounded lightweight-verify lane for chore/XS specs (no separate verify session)."
    evidence: "bragfile feedback round 1 (#2) + round 2 (§C) — re-flagged twice, un-adopted"
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-04-20
    last_touched: 2026-06-12
    raised_by: claude
    notes: "Strict boundary if accepted: no constraint-touching code, no new command, no new storage method. Accept-and-schedule or reject-with-reason at project close — do not silently carry a third time."

  # --- process-debt: smaller, also un-adopted ---------------------------------
  - id: collapse-build-completion-and-reflection
    type: process-debt
    summary: "Build Completion and the build-phase reflection overlap; collapse into one section."
    evidence: "bragfile feedback round 1 (#5) + round 2 (§C) — still two overlapping sections"
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-04-20
    last_touched: 2026-06-12
    raised_by: claude
    notes: null

  # --- product: usage signal that should shape the NEXT project's framing ------
  - id: context-coldread-cost
    type: product
    summary: "Cold-read context cost grows with corpus size (AGENTS.md 300+ lines, large specs)."
    evidence: "bragfile feedback round 1 (friction #6) + round 2 (§B2 — extract another sub-template)"
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-04-20
    last_touched: 2026-06-12
    raised_by: claude
    notes: "Feed the next project's frame: budget a sub-template extraction / a stack gotchas-checklist companion to relieve cold-read cost."

  # --- risk: tracked, revisited each close, no auto-action ---------------------
  - id: solo-discipline-erosion
    type: risk
    summary: "Self-imposed discipline erodes silently under solo claude-only use (no team pressure)."
    evidence: "bragfile feedback round 1 + round 2 meta-observation"
    bar: null
    status: watch
    disposition_at: project-close
    first_flagged: 2026-04-20
    last_touched: 2026-06-12
    raised_by: claude
    notes: "No auto-action. Revisit at each project close: are the fresh-session, verify, and one-PR-per-spec habits still holding?"

  - id: session-cannot-report-tokens
    type: process-debt
    summary: "Build/verify run as separate sessions (start_session) cannot run /cost, so the cost-audit gate cannot be satisfied by the executor; cost must be recovered from session transcripts or the cycle run as a metered sub-agent."
    evidence: "SPEC-001 build and verify (HANDOFF-001/002): tokens_total null at handback; recovered by summing usage in ~/.claude/projects/<worktree>/*.jsonl (input+output+cache_creation, de-duplicated by message id)."
    bar: null
    status: accepted
    disposition_at: project-close
    first_flagged: 2026-11-05
    last_touched: 2026-11-05
    raised_by: claude
    notes: "Decision 2026-11-05: run build/verify as sub-agents (subagent_tokens metering). Consider a script that recovers tokens from a transcript if sessions are used again."

  - id: decisions-audit-reads-block-lists-only
    type: process-debt
    summary: "scripts/decisions-audit.sh get_affected_scope parses only block-style YAML lists, so `affected_scope: [a, b]` (flow style) extracts no globs and `--changed` silently matches nothing."
    evidence: "SPEC-004 verify (HANDOFF-010, finding 2): `just decisions-audit --changed` reported no match for src/tiff/mod.rs although DEC-001/002/003/005 govern it. Worked around here by writing every DEC's affected_scope as a block list; the script itself is template/irradiance-owned and not modified."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-11-05
    last_touched: 2026-11-05
    raised_by: claude
    notes: "Upstream fix (accept flow lists, or fail loudly on an unparsed scope) belongs in the template and irradiance; also check the audit rejects a DEC with zero parsed globs."

  - id: measure-exit-status-without-a-pipe
    type: lesson
    summary: "A shell loop that pipes a tool into another command reports the LAST command's exit status; a spec's 'measured fact' about a tool's exit codes was wrong for that reason."
    evidence: "SPEC-005 design wrote 'ExifTool exits 0 on every seed' from `exiftool ... | tr; echo exit=$?`. Build and verify (HANDOFF-013/014) measured two-hop-cycle never returns and two seeds exit 1. The false claim reached a code comment before verify caught it. N=1."
    bar: "N=2 occurrences, then add 'capture stdout to a file, read the tool's own status, run with a hard time limit' to the spec-design checklist"
    status: open
    disposition_at: project-close
    first_flagged: 2026-11-05
    last_touched: 2026-11-05
    raised_by: claude
    notes: "Related rule: measurement-over-generalised (exact command and scope for every measured claim)."

  - id: oracle-has-no-sbyte-selector
    type: process-debt
    summary: "The parity oracle has no selector that reads an SBYTE value: no standard Exif tag of that type is in the selector table, so the SBYTE decoder is checked by unit tests only, not against ExifTool."
    evidence: "SPEC-011 design left it out by decision (non-goal: 'The SBYTE selector'); SPEC-008's signed/float fixtures cover SSHORT, SLONG, FLOAT and DOUBLE only. N=1."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-11-05
    last_touched: 2026-11-05
    raised_by: claude-sonnet-5-5
    notes: "Needs a measured ExifTool tag that honours a declared SBYTE type (the SPEC-008 measurement found three of seventeen candidates did not follow the declared type)."

  - id: divergence-entries-must-pin-our-values
    type: lesson
    summary: "A recorded divergence that says 'ExifTool reads nothing here' lets any value of ours pass unless the entry also pins our reading; a wildcard divergence was a loosening although the spec said divergences never loosen."
    evidence: "SPEC-011: `exif:*` accepted a wrong Make and 13 dropped fields on two fixtures; found by the SPEC-011 verifier (HANDOFF-022 M1), closed by pinning to the same TIFF read normally. N=1."
    bar: "N=2 occurrences, then add 'a divergence entry names what our side must still equal' to the oracle-spec design checklist"
    status: watch
    disposition_at: project-close
    first_flagged: 2026-11-05
    last_touched: 2026-11-05
    raised_by: claude
    notes: "Related: oracle-must-be-shown-red (apply it to the divergence list too)."

  - id: run-ci-only-gates-locally
    type: lesson
    summary: "A gate that runs only in CI (here the fuzz lint red-proof script) can break on a structural change (a new include!d directory) that every local gate misses; the build brief must name the CI-only scripts."
    evidence: "SPEC-010 PR 14: lint-fuzz-red-proof failed in CI because the script copied only fuzz_targets and the target now include!d fuzz/shared; local gates did not run it. SPEC-011's brief named it and the build ran it. N=1."
    bar: "N=2 occurrences, then add 'list the CI-only scripts in every build brief' to the handoff template"
    status: watch
    disposition_at: project-close
    first_flagged: 2026-11-05
    last_touched: 2026-11-05
    raised_by: claude
    notes: "Alternative: add these scripts to a single `just ci-local` recipe."

  - id: fuzz-guard-needs-seeds-for-every-class
    type: lesson
    summary: "A fuzz guard over a classification proves nothing about classes its seeds never reach; add a seed per class or the guard is vacuous for it."
    evidence: "SPEC-014 verify F1 (DeviceId/MakerNote not in any audit seed; a plant was not found in 181 s) and SPEC-015 verify N4 (no seed with a tag character; a harness safe_text missing that range went unnoticed by the harness). N=2."
    bar: "N=3 same-outcome"
    status: watch
    disposition_at: stage-close
    first_flagged: 2026-11-06
    last_touched: 2026-11-06
    raised_by: claude
    notes: "At N=2. Third occurrence codifies 'every classification guard lists its classes and the harness test asserts a seed reaches each' into the spec design checklist."

  - id: equality-guard-plants-must-vary-in-kind
    type: lesson
    summary: "Plants for an equality guard must vary in kind (length, content at the start, middle and end, order), not in one dimension, or a weaker guard passes every plant."
    evidence: "SPEC-018 verify F1/D1 (all 8 builder-equals-oneshot plants changed the length; a length-only guard passed the suite) and D2 (High/Low alone left a swapped Low/Medium ranking alive). N=1; pairs with fuzz-guard-needs-seeds-for-every-class."
    bar: "N=3 same-outcome"
    status: watch
    disposition_at: stage-close
    first_flagged: 2026-11-07
    last_touched: 2026-11-06
    raised_by: claude
    notes: "At N=1. Walk at STAGE-003 close alongside the SPEC-014/015 guard lesson."

  - id: check-then-open-needs-a-safe-open
    type: lesson
    summary: "A 'never open X' promise about a filesystem object needs the open itself to be safe (non-blocking, re-checked on the handle), not only a pre-check, because the path can change in between."
    evidence: "SPEC-016 verify F1: a FIFO renamed over a scanned name between the walk's check and read_file's open hung the binary (3 of 127 races). N=1."
    bar: "N=3 same-outcome"
    status: watch
    disposition_at: stage-close
    first_flagged: 2026-11-07
    last_touched: 2026-11-06
    raised_by: claude
    notes: "At N=1. Walk at STAGE-003 close."

  - id: fuzz-shared-files-outside-the-fmt-gate
    type: process-debt
    summary: "fuzz/shared/*.rs are included by path into the fuzz crate, so `cargo fmt --all` never checks them; an unformatted harness file shipped from a build and was caught only by an ad-hoc rustfmt line in the orchestrator's gate script."
    evidence: "SPEC-019 ship gates: rustfmt --check failed on fuzz/shared/jpeg_metadata_invariants.rs and render_invariants.rs after a green build handback. Fixed in the same ship by adding `rustfmt --check --edition 2021 fuzz/shared/*.rs` to `just lint` (app.just). N=1."
    bar: "N=1 fixed"
    status: watch
    disposition_at: project-close
    first_flagged: 2026-11-10
    last_touched: 2026-11-10
    raised_by: claude
    notes: "Closed in practice by the app.just change; walk at STAGE-004 close and drop if no recurrence."
